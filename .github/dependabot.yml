version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "UTC"

    open-pull-requests-limit: 10

    commit-message:
      prefix: "deps"

    labels:
      - dependencies

    groups:
      npm:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:15"
      timezone: "UTC"

    commit-message:
      prefix: "ci"

    labels:
      - github-actions

    groups:
      actions:
        patterns:
          - "*"